*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --pink-deep:#1a0010;

html,body{height:100%;overflow:hidden;}

body{

}

/* ambient orbs */
.orb{
  position:fixed;border-radius:50%;pointer-events:none;z-index:0;
  animation:orbFloat 18s ease-in-out infinite;
}
.orb1{
  width:500px;height:500px;
  background:radial-gradient(circle,rgba(255,45,120,0.18) 0%,transparent 65%);
  top:-150px;left:-100px;animation-delay:0s;
}
.orb2{
  width:600px;height:600px;
  background:radial-gradient(circle,rgba(212,168,71,0.12) 0%,transparent 65%);
  bottom:-200px;right:-150px;animation-delay:-9s;
}
.orb3{
  width:350px;height:350px;
  background:radial-gradient(circle,rgba(255,79,163,0.14) 0%,transparent 65%);
  top:40%;left:60%;animation-delay:-5s;
}
@keyframes orbFloat{
  0%,100%{transform:translate(0,0);}
  33%{transform:translate(30px,20px);}
  66%{transform:translate(-20px,35px);}
}

/* page system */
.page{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  transition:opacity .5s ease, transform .5s ease;
  overflow-y:auto;
  z-index:1;
}
.page.hidden{opacity:0;pointer-events:none;transform:translateY(20px);}
.page.active{opacity:1;pointer-events:all;transform:translateY(0);}

/* ── LANDING PAGE ── */
#page-home{flex-direction:column;gap:0;}
.home-inner{
  display:flex;flex-direction:column;align-items:center;
  max-width:480px;width:100%;
  gap:0;
}

.title-glass{
  position:relative;
  padding:32px 40px 28px;
  border-radius:28px;
  background:linear-gradient(135deg,rgba(255,255,255,0.13) 0%,rgba(255,255,255,0.06) 50%,rgba(255,200,180,0.08) 100%);
  backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,0.18);
  box-shadow:
    0 0 60px rgba(255,45,120,0.18),
    0 0 0 1px rgba(255,255,255,0.06) inset,
    0 20px 60px rgba(0,0,0,0.4);
  text-align:center;
  margin-bottom:28px;
  overflow:hidden;
}
.title-glass::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(140deg,rgba(255,255,255,0.18) 0%,transparent 40%);
  pointer-events:none;border-radius:28px;
}
.title-glass::after{
  content:'';position:absolute;
  top:-60%;left:-60%;width:220%;height:220%;
  background:radial-gradient(circle,rgba(255,255,255,0.06) 0%,transparent 55%);
  pointer-events:none;
}

.title-main{
  font-family:'Playfair Display',serif;
  font-size:clamp(38px,8vw,58px);
  line-height:1.05;
  letter-spacing:-0.01em;
  position:relative;z-index:1;
}
.title-find{
  color:var(--pink-bright);
  text-shadow:0 0 30px rgba(255,79,163,0.5);
  display:block;
}
.title-inner{
  color:var(--gold-light);

}

.tagline{

.btn-start{
  display:inline-block;

  transition:all .25s ease;
  margin-bottom:18px;
}
.btn-start:hover{

}
