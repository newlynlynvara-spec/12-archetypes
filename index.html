      import { createFileRoute, useNavigate } from "@tanstack/react-router";
import { useEffect, useMemo, useState } from "react";
import { AnimatePresence, motion } from "framer-motion";
import { questions } from "@/lib/questions";
import { archetypeOrder, type ArchetypeKey } from "@/lib/archetypes";
import { DreamyBackground } from "@/components/DreamyBackground";
import { Roach } from "@/components/Roach";

const STORAGE_KEY = "mythos.answers.v2";
const INDEX_KEY = "mythos.index.v2";

export const Route = createFileRoute("/quiz")({
  head: () => ({
    meta: [
      { title: "แบบทดสอบ — Mythos" },
      { name: "description", content: "แบบทดสอบ 24 ข้อ ค้นหาอาร์คีไทป์ของคุณ" },
    ],
  }),
  component: Quiz,
});

type AnswersMap = Record<number, number>;

function Quiz() {
  const navigate = useNavigate();
  const [index, setIndex] = useState(0);
  const [answers, setAnswers] = useState<AnswersMap>({});
  const [direction, setDirection] = useState(1);
  const [hydrated, setHydrated] = useState(false);
  const [revealing, setRevealing] = useState(false);

  useEffect(() => {
    try {
      const a = localStorage.getItem(STORAGE_KEY);
      const i = localStorage.getItem(INDEX_KEY);
      if (a) setAnswers(JSON.parse(a));
      if (i) setIndex(Math.min(parseInt(i, 10) || 0, questions.length - 1));
    } catch {}
    setHydrated(true);
  }, []);

  useEffect(() => {
    if (!hydrated) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(answers));
      localStorage.setItem(INDEX_KEY, String(index));
    } catch {}
  }, [answers, index, hydrated]);

  const q = questions[index];
  const answeredCount = Object.keys(answers).length;
  const progress = (answeredCount / questions.length) * 100;

  const handleAnswer = (answerIdx: number) => {
    const next = { ...answers, [q.id]: answerIdx };
    setAnswers(next);
    setTimeout(() => {
      if (index < questions.length - 1) {
        setDirection(1);
        setIndex(index + 1);
      } else {
        finish(next);
      }
    }, 380);
  };

  const finish = (final: AnswersMap) => {
    const scores: Record<ArchetypeKey, number> = Object.fromEntries(
      archetypeOrder.map((k) => [k, 0]),
    ) as Record<ArchetypeKey, number>;
    for (const question of questions) {
      const pickIdx = final[question.id];
      if (pickIdx == null) continue;
      const ans = question.answers[pickIdx];
      if (!ans) continue;
      const weight = 1 / ans.archetypes.length;
      for (const key of ans.archetypes) scores[key] += weight;
    }
    try {
      localStorage.setItem("mythos.scores.v2", JSON.stringify(scores));
    } catch {}
    const sorted = [...archetypeOrder].sort((a, b) => scores[b] - scores[a]);
    setRevealing(true);
    setTimeout(() => {
      navigate({ to: "/result/$archetype", params: { archetype: sorted[0] } });
    }, 2400);
  };

  const goBack = () => {
    if (index > 0) {
      setDirection(-1);
      setIndex(index - 1);
    }
  };

  const reset = () => {
    setAnswers({});
    setIndex(0);
    setDirection(1);
    try {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(INDEX_KEY);
    } catch {}
  };

  const current = answers[q.id];

  const variants = useMemo(
    () => ({
      enter: (dir: number) => ({ opacity: 0, y: dir > 0 ? 40 : -40, scale: 0.95, filter: "blur(8px)" }),
      center: { opacity: 1, y: 0, scale: 1, filter: "blur(0px)" },
      exit: (dir: number) => ({ opacity: 0, y: dir > 0 ? -40 : 40, scale: 0.95, filter: "blur(8px)" }),
    }),
    [],
  );

  if (revealing) {
    return (
      <>
        <DreamyBackground />
        <main className="min-h-screen flex items-center justify-center px-6 relative z-10">
          <motion.div
            initial={{ opacity: 0, scale: 0.7 }}
            animate={{ opacity: 1, scale: 1 }}
            transition={{ duration: 1 }}
            className="text-center"
          >
            <motion.div
              animate={{ y: [0, -16, 0], rotate: [-8, 8, -8] }}
              transition={{ duration: 3, repeat: Infinity, ease: "easeInOut" }}
              className="mb-8 inline-block"
            >
              <Roach size={88} />
            </motion.div>
            <motion.div
              animate={{ opacity: [0.5, 1, 0.5] }}
              transition={{ duration: 2, repeat: Infinity }}
              className="font-display text-2xl sm:text-3xl text-gradient-rose mb-3"
            >
              กำลังอ่านใจคุณอยู่…
            </motion.div>
            <p className="font-body text-foreground/65 tracking-wide text-sm">
              อีกแป๊บนึงนะ
            </p>
          </motion.div>
        </main>
      </>
    );
  }

  return (
    <>
      <DreamyBackground />
      <main className="min-h-screen px-4 sm:px-6 py-10 sm:py-16 flex flex-col items-center relative z-10">
        <div className="w-full max-w-2xl">
          {/* Progress */}
          <div className="mb-8">
            <div className="ornate-divider mb-4 text-[10px] tracking-[0.4em] uppercase font-display">
              <span className="shimmer-gold">ข้อ {index + 1} / {questions.length}</span>
            </div>
            <div className="relative h-[6px] rounded-full bg-mauve/40 overflow-hidden border border-gold/20">
              <motion.div
                className="absolute inset-y-0 left-0 rounded-full"
                style={{
                  background: "linear-gradient(90deg, #F2C572, #FF4FA3, #F2C572)",
                  backgroundSize: "200% 100%",
                  boxShadow: "0 0 20px rgba(255, 79, 163, 0.6), 0 0 10px rgba(242, 197, 114, 0.6)",
                }}
                animate={{ width: `${progress}%`, backgroundPosition: ["0% 50%", "200% 50%"] }}
                transition={{
                  width: { type: "spring", stiffness: 80, damping: 20 },
                  backgroundPosition: { duration: 4, repeat: Infinity, ease: "linear" },
                }}
              />
            </div>
            <div className="mt-2 text-right text-[10px] tracking-[0.25em] shimmer-gold font-display">
              {Math.round(progress)}%
            </div>
          </div>

          <AnimatePresence mode="wait" custom={direction}>
            <motion.div
              key={q.id}
              custom={direction}
              variants={variants}
              initial="enter"
              animate="center"
              exit="exit"
              transition={{ duration: 0.55, ease: [0.22, 1, 0.36, 1] }}
              className="relative rounded-[2rem] tarot-frame glass-rose p-6 sm:p-12"
            >
              <div className="text-center mb-9 sm:mb-10 relative">
                <motion.div
                  animate={{ y: [0, -6, 0], rotate: [-6, 6, -6] }}
                  transition={{ duration: 4, repeat: Infinity, ease: "easeInOut" }}
                  className="mb-5 inline-block"
                >
                  <Roach size={28} />
                </motion.div>
                <div className="text-[10px] tracking-[0.4em] uppercase text-gold/80 mb-4 font-display">
                  ข้อที่ {String(index + 1).padStart(2, "0")}
                </div>
                <h2 className="font-display text-[1.45rem] sm:text-[1.9rem] leading-[1.45] text-foreground">
                  {q.question_th}
                </h2>
              </div>

              <div className="space-y-3">
                {q.answers.map((opt, i) => {
                  const selected = current === i;
                  const letter = ["ก", "ข", "ค", "ง"][i];
                  return (
                    <motion.button
                      key={i}
                      onClick={() => handleAnswer(i)}
                      whileHover={{ scale: 1.015, y: -2 }}
                      whileTap={{ scale: 0.985 }}
                      transition={{ type: "spring", stiffness: 300, damping: 22 }}
                      className={`group w-full relative flex items-start gap-4 rounded-2xl px-5 sm:px-6 py-4 sm:py-5 text-left transition-all overflow-hidden border ${
                        selected
                          ? "border-transparent text-white shadow-glow"
                          : "border-gold/25 bg-gradient-to-br from-white/[0.07] to-white/[0.01] hover:border-gold/60 backdrop-blur-md"
                      }`}
                      style={selected ? { background: "var(--gradient-rose)" } : undefined}
                    >
                      {!selected && (
                        <span
                          className="pointer-events-none absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-500"
                          style={{
                            background:
                              "radial-gradient(circle at 50% 100%, rgba(255, 79, 163, 0.25), transparent 70%)",
                          }}
                        />
                      )}

                      <span
                        className={`shrink-0 mt-0.5 flex h-9 w-9 items-center justify-center rounded-full border font-display text-sm ${
                          selected
                            ? "border-white/60 bg-white/15 text-white"
                            : "border-gold/40 text-gold bg-mauve/20"
                        }`}
                      >
                        {letter}
                      </span>

                      <span className={`font-body text-[1.02rem] sm:text-[1.08rem] leading-relaxed flex-1 ${selected ? "text-white" : "text-foreground/90"}`}>
                        {opt.text_th}
                      </span>

                      {selected && (
                        <motion.span
                          initial={{ scale: 0, rotate: -90 }}
                          animate={{ scale: 1, rotate: 0 }}
                          className="shrink-0 mt-1"
                        >
                          <Roach size={20} />
                        </motion.span>
                      )}
                    </motion.button>
                  );
                })}
              </div>
            </motion.div>
          </AnimatePresence>

          <div className="mt-7 flex justify-between items-center px-2">
            <button
              onClick={goBack}
              disabled={index === 0}
              className="font-body text-sm text-foreground/55 disabled:opacity-20 hover:text-gold transition"
            >
              ← ย้อนกลับ
            </button>
            <button
              onClick={reset}
              className="font-body text-xs text-foreground/45 hover:text-gold transition"
            >
              ↻ เริ่มใหม่
            </button>
          </div>
          <p className="mt-5 text-center font-body text-xs sm:text-sm text-foreground/55">
            ตอบจากใจที่คิดได้ตอนแรก ไม่ต้องคิดเยอะ
          </p>
        </div>
      </main>
    </>
  );
      }

                animate={{ opacity: [0.2, 1, 0.2], y: [0, -10, 0] }}
                transition={{ duration: 3 + (i % 4), repeat: Infinity, delay: i * 0.2 }}
              />
            ))}

            {/* Card content */}
            <div className="relative h-full flex flex-col items-center justify-between py-8 px-6 text-white">
              <div className="text-center">
                <div className="text-[10px] tracking-[0.5em] opacity-80 mb-2">— {primary.romanNumeral} —</div>
                <div className="text-xs tracking-[0.4em] uppercase opacity-90 font-display">{primary.name}</div>
              </div>

              <motion.div
                initial={{ scale: 0, rotate: -180, opacity: 0 }}
                animate={{ scale: 1, rotate: 0, opacity: 1 }}
                transition={{ duration: 1.5, delay: 0.8, type: "spring", damping: 14 }}
                style={{ filter: "drop-shadow(0 0 30px rgba(242,197,114,0.7))" }}
              >
                <Roach size={120} />
              </motion.div>

              <div className="text-center">
                <motion.h1
                  initial={{ opacity: 0, y: 20 }}
                  animate={{ opacity: 1, y: 0 }}
                  transition={{ duration: 1, delay: 1.2 }}
                  className="font-display text-5xl sm:text-6xl mb-2 leading-none"
                  style={{ textShadow: "0 4px 30px rgba(0,0,0,0.4)" }}
                >
                  {primary.nameTh}
                </motion.h1>
                <div className="mt-3 inline-flex"><Roach size={14} /></div>
              </div>
            </div>
          </motion.div>

          {/* Tagline */}
          <motion.p
            initial={{ opacity: 0 }}
            animate={{ opacity: 1 }}
            transition={{ duration: 1, delay: 1.4 }}
            className="text-center font-display text-xl sm:text-2xl text-gradient-rose mb-12 px-4"
          >
            “{primary.tagline}”
          </motion.p>

          {/* Summary card */}
          <motion.div
            initial={{ opacity: 0, y: 30 }}
            animate={{ opacity: 1, y: 0 }}
            transition={{ duration: 0.9, delay: 1.5 }}
            className="rounded-3xl tarot-frame glass-rose p-7 sm:p-10 mb-8"
          >
            <div className="ornate-divider mb-5 text-[10px] tracking-[0.4em] uppercase font-display">
              <span className="shimmer-gold">เกี่ยวกับคุณ</span>
            </div>
            <p className="font-body text-foreground/90 text-base sm:text-lg leading-relaxed">
              {primary.summary}
            </p>

            <p className="mt-8 font-display text-xl sm:text-2xl text-foreground/95 leading-relaxed border-l-2 border-gold/60 pl-5"
               style={{ background: "linear-gradient(90deg, rgba(242,197,114,0.08), transparent)" }}
            >
              “{primary.quote}”
            </p>
          </motion.div>

          {/* Desire / Fear */}
          <motion.div
            initial={{ opacity: 0, y: 30 }}
            animate={{ opacity: 1, y: 0 }}
            transition={{ duration: 0.9, delay: 1.6 }}
            className="grid sm:grid-cols-2 gap-5 mb-8"
          >
            <div className="rounded-3xl tarot-frame glass p-6">
              <div className="text-[10px] tracking-[0.35em] uppercase shimmer-gold mb-3 font-display flex items-center gap-2">
                <Roach size={14} /> สิ่งที่คุณอยากได้
              </div>
              <p className="font-body text-foreground/90 leading-relaxed">{primary.desire}</p>
            </div>
            <div className="rounded-3xl tarot-frame glass p-6">
              <div className="text-[10px] tracking-[0.35em] uppercase shimmer-gold mb-3 font-display flex items-center gap-2">
                <Roach size={14} /> สิ่งที่คุณกลัว
              </div>
              <p className="font-body text-foreground/90 leading-relaxed">{primary.fear}</p>
            </div>
          </motion.div>

          {/* Strengths / Weaknesses */}
          <motion.div
            initial={{ opacity: 0, y: 30 }}
            animate={{ opacity: 1, y: 0 }}
            transition={{ duration: 0.9, delay: 1.7 }}
            className="grid sm:grid-cols-2 gap-5 mb-8"
          >
            <div className="rounded-3xl tarot-frame glass p-6">
              <div className="text-[10px] tracking-[0.35em] uppercase shimmer-gold mb-4 font-display flex items-center gap-2">
                <Roach size={14} /> จุดแข็งของคุณ
              </div>
              <ul className="space-y-2.5 font-body text-foreground/90">
                {primary.strengths.map((s) => (
                  <li key={s} className="flex gap-2.5 leading-relaxed items-start">
                    <span className="mt-1 shrink-0"><Roach size={11} /></span>
                    <span>{s}</span>
                  </li>
                ))}
              </ul>
            </div>
            <div className="rounded-3xl tarot-frame glass p-6">
              <div className="text-[10px] tracking-[0.35em] uppercase shimmer-gold mb-4 font-display flex items-center gap-2">
                <Roach size={14} /> ด้านที่ต้องระวัง
              </div>
              <ul className="space-y-2.5 font-body text-foreground/90">
                {primary.weaknesses.map((s) => (
                  <li key={s} className="flex gap-2.5 leading-relaxed items-start">
                    <span className="mt-1 shrink-0"><Roach size={11} /></span>
                    <span>{s}</span>
                  </li>
                ))}
              </ul>
            </div>
          </motion.div>

          {/* Soul palette */}
          <motion.div
            initial={{ opacity: 0, y: 30 }}
            animate={{ opacity: 1, y: 0 }}
            transition={{ duration: 0.9, delay: 1.8 }}
            className="rounded-3xl tarot-frame glass p-7 mb-8"
          >
            <div className="ornate-divider text-[10px] tracking-[0.4em] uppercase mb-6 font-display">
              <span className="shimmer-gold">สีของวิญญาณคุณ</span>
            </div>
            <div className="flex justify-center gap-5">
              {primary.colors.map((c, i) => (
                <motion.div
                  key={c}
                  initial={{ scale: 0, opacity: 0 }}
                  animate={{ scale: 1, opacity: 1 }}
                  transition={{ delay: 1.9 + i * 0.1, type: "spring" }}
                  className="flex flex-col items-center gap-2"
                >
                  <div
                    className="h-14 w-14 rounded-full gold-ring"
                    style={{ background: c, boxShadow: `0 0 30px ${c}66, 0 0 0 1px oklch(0.82 0.14 78 / 0.5)` }}
                  />
                  <span className="text-[10px] text-foreground/60 font-mono tracking-wider">{c}</span>
                </motion.div>
              ))}
            </div>
          </motion.div>

          {/* Secondary archetype */}
          <motion.div
            initial={{ opacity: 0, y: 20 }}
            animate={{ opacity: 1, y: 0 }}
            transition={{ duration: 0.9, delay: 1.9 }}
            className="rounded-3xl tarot-frame glass-rose p-7 mb-8"
          >
            <div className="text-[10px] tracking-[0.4em] uppercase shimmer-gold mb-4 font-display text-center flex items-center justify-center gap-2">
              <Roach size={14} /> อาร์คีไทป์รอง
            </div>
            <div className="flex items-center gap-5 justify-center">
              <div
                className="h-20 w-14 rounded-xl tarot-frame flex items-center justify-center text-white shrink-0"
                style={{ background: secondary.gradient }}
              >
                <Roach size={28} />
              </div>
              <div className="text-center sm:text-left">
                <h3 className="font-display text-3xl text-gradient-rose leading-tight">
                  {secondary.nameTh}
                </h3>
                <p className="font-body text-foreground/65 mt-1 text-sm">{secondary.tagline}</p>
              </div>
            </div>
          </motion.div>

          {/* Soul mixture */}
          {scores && (
            <motion.div
              initial={{ opacity: 0, y: 30 }}
              animate={{ opacity: 1, y: 0 }}
              transition={{ duration: 0.9, delay: 2.0 }}
              className="rounded-3xl tarot-frame glass p-7 sm:p-8 mb-8"
            >
              <div className="ornate-divider text-[10px] tracking-[0.4em] uppercase mb-6 font-display">
                <span className="shimmer-gold">ส่วนผสมในตัวคุณ</span>
              </div>
              <div className="space-y-3.5">
                {ranked.map((k, i) => {
                  const a = archetypes[k];
                  const pct = percent(k);
                  if (pct === 0) return null;
                  return (
                    <div key={k}>
                      <div className="flex justify-between font-body text-sm mb-1.5">
                        <span className="text-foreground/85 flex items-center gap-2">
                          <Roach size={12} />
                          {a.nameTh}
                        </span>
                        <span className="shimmer-gold font-display tracking-wider">{pct}%</span>
                      </div>
                      <div className="h-1.5 rounded-full bg-mauve/40 overflow-hidden border border-gold/15">
                        <motion.div
                          initial={{ width: 0 }}
                          animate={{ width: `${pct}%` }}
                          transition={{ duration: 1, delay: 2.1 + i * 0.04, ease: "easeOut" }}
                          className="h-full"
                          style={{
                            background: "linear-gradient(90deg, #F2C572, #FF4FA3)",
                            boxShadow: "0 0 12px rgba(255, 79, 163, 0.5)",
                          }}
                        />
                      </div>
                    </div>
                  );
                })}
              </div>
            </motion.div>
          )}

          {/* Premium */}
          <motion.div
            initial={{ opacity: 0, y: 30 }}
            animate={{ opacity: 1, y: 0 }}
            transition={{ duration: 0.9, delay: 2.2 }}
            className="relative rounded-[2rem] tarot-frame overflow-hidden mb-10"
          >
            <div
              className="absolute inset-0"
              style={{
                background:
                  "radial-gradient(ellipse at 50% 0%, oklch(0.45 0.18 350) 0%, transparent 60%), linear-gradient(135deg, oklch(0.22 0.08 340), oklch(0.18 0.06 320))",
              }}
            />
            <div className="absolute inset-0 opacity-30 bg-gradient-gold mix-blend-overlay" />
            <div className="relative p-8 sm:p-10 text-center text-white">
              <motion.div
                animate={{ y: [0, -8, 0], rotate: [-6, 6, -6] }}
                transition={{ duration: 4, repeat: Infinity, ease: "easeInOut" }}
                className="mb-3 inline-block"
              >
                <Roach size={42} />
              </motion.div>
              <div className="text-[10px] tracking-[0.4em] uppercase text-gold/80 mb-3 font-display">
                เวอร์ชัน Premium · ยังล็อกอยู่
              </div>
              <h3 className="font-display text-3xl sm:text-4xl mb-3 text-gradient-rose">
                อยากรู้จักตัวเองให้ลึกกว่านี้?
              </h3>
              <p className="font-body text-white/75 text-sm sm:text-base leading-relaxed max-w-md mx-auto mb-7">
                เจาะลึกตัวตนคุณอีกชั้น —
                ทั้งด้านมืดที่ซ่อนอยู่ รูปแบบความรัก และแรงขับที่คุณไม่รู้ตัว
              </p>

              <ul className="grid sm:grid-cols-2 gap-2.5 text-left text-sm text-white/85 max-w-lg mx-auto mb-8 font-body">
                {[
                  "48 คำถามเจาะลึก",
                  "Shadow Archetype — ด้านมืดที่ซ่อน",
                  "รูปแบบทางอารมณ์",
                  "แนวโน้มแบบ MBTI",
                  "พลังงานแบบ Enneagram",
                  "พลวัตในความรัก",
                  "แรงขับใต้สำนึก",
                  "ความขัดแย้งภายใน",
                ].map((t) => (
                  <li key={t} className="flex items-start gap-2">
                    <span className="mt-0.5 shrink-0"><Roach size={11} /></span>
                    <span>{t}</span>
                  </li>
                ))}
              </ul>

              <button
                disabled
                className="inline-flex items-center gap-2 rounded-full bg-gradient-gold px-9 py-3.5 text-sm font-medium tracking-[0.15em] uppercase text-black/80 shadow-glow cursor-not-allowed opacity-90"
              >
                🔒 ปลดล็อกเวอร์ชันลึก
              </button>
              <p className="mt-3 font-body text-xs text-white/55">เร็ว ๆ นี้</p>
            </div>
          </motion.div>

          {/* Actions */}
          <motion.div
            initial={{ opacity: 0 }}
            animate={{ opacity: 1 }}
            transition={{ duration: 0.9, delay: 2.4 }}
            className="flex flex-col sm:flex-row items-center justify-center gap-5"
          >
            <Link
              to="/quiz"
              className="rounded-full px-9 py-3.5 text-white shadow-glow hover:scale-105 transition tracking-[0.15em] text-sm flex items-center gap-2"
              style={{ background: "var(--gradient-rose)" }}
            >
              <Roach size={16} /> ทำแบบทดสอบอีกครั้ง
            </Link>
            <Link to="/" className="font-body text-sm text-foreground/55 hover:text-gold underline-offset-4 hover:underline">
              ← กลับหน้าแรก
            </Link>
          </motion.div>
        </div>
      </main>
    </>
  );
      }
